
name: BookReaderTTS
options:
  bundleIdPrefix: com.bookreader
  xcodeVersion: "14.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "4.2"
    CURRENT_PROJECT_VERSION: "1"

targets:
  BookReaderTTS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - BookReaderTTS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bookreader.tts
        INFOPLIST_FILE: BookReaderTTS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
