name: Build IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - run: brew install xcodegen
      - run: xcodegen generate --spec project.yml
      - run: sed -i '' 's/objectVersion = 77/objectVersion = 56/g' BookReaderTTS.xcodeproj/project.pbxproj || true
      - run: |
          mkdir -p build
          xcodebuild -project BookReaderTTS.xcodeproj -scheme BookReaderTTS -configuration Release -sdk iphoneos -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - run: |
          APP=build/DerivedData/Build/Products/Release-iphoneos/BookReaderTTS.app
          rm -rf $APP/_CodeSignature
          chmod +x $APP/BookReaderTTS
          rm -rf Payload; mkdir Payload; cp -R $APP Payload/
          zip -r BookReaderTTS-4.3.2-IconFixed-Minimal.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BookReaderTTS-IPA
          path: BookReaderTTS-4.3.2-IconFixed-Minimal.ipa
