name: Build IPA for SideStore
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Project (Xcode 14 compatible)
        run: |
          xcodegen generate --spec project.yml
          # objectVersion 77 -> 56 (Xcode 15.4 호환)
          sed -i '' 's/objectVersion = 77/objectVersion = 56/g' BookReaderTTS.xcodeproj/project.pbxproj || sed -i 's/objectVersion = 77/objectVersion = 56/g' BookReaderTTS.xcodeproj/project.pbxproj
          # CFBundleExecutable가 null이 되는 버그 방지: Info.plist에서 제거하고 Xcode가 자동 생성하게 함
          /usr/libexec/PlistBuddy -c "Delete :CFBundleExecutable" BookReaderTTS/Info.plist || true

      - name: Build .app (no signing)
        run: |
          mkdir -p build
          xcodebuild -project BookReaderTTS.xcodeproj \
            -scheme BookReaderTTS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -skipPackagePluginValidation

      - name: Create IPA for SideStore (fix executable)
        run: |
          APP=$(find build/DerivedData -name "*.app" -type d | head -1)
          echo "APP Found: $APP"
          ls -l "$APP"
          # 1. 코드서명 제거 (SideStore가 직접 서명함)
          rm -rf "$APP/_CodeSignature"
          # 2. 실행파일 권한 복구
          EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          echo "Executable: $EXEC"
          chmod +x "$APP/$EXEC"
          # 3. Payload 구조로 IPA 생성
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r BookReaderTTS-unsigned.ipa Payload -x "*.DS_Store"
          unzip -l BookReaderTTS-unsigned.ipa | head -20
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: BookReaderTTS-IPA
          path: BookReaderTTS-unsigned.ipa
