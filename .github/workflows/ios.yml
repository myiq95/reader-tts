
name: Build IPA for SideStore
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Project
        run: |
          xcodegen generate --spec project.yml
          sed -i '' 's/objectVersion = 77/objectVersion = 56/g' BookReaderTTS.xcodeproj/project.pbxproj || sed -i 's/objectVersion = 77/objectVersion = 56/g' BookReaderTTS.xcodeproj/project.pbxproj
      - name: Build .app
        run: |
          mkdir -p build
          xcodebuild -project BookReaderTTS.xcodeproj -scheme BookReaderTTS -configuration Release -sdk iphoneos -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -skipPackagePluginValidation
      - name: Create IPA for SideStore
        run: |
          APP=$(find build/DerivedData -name "*.app" -type d | head -1)
          echo "APP: $APP"
          rm -rf "$APP/_CodeSignature"
          EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          chmod +x "$APP/$EXEC"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r BookReaderTTS-unsigned.ipa Payload
          ls -lh *.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: BookReaderTTS-IPA
          path: BookReaderTTS-unsigned.ipa
